[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-notes-to-obsidian"
version = "0.1.0"
description = "Sync Zotero Desktop notes into an Obsidian vault as Markdown."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Zotero Notes to Obsidian contributors" }
]
keywords = ["zotero", "obsidian", "markdown", "notes", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lojeunhou/zotero-notes-to-obsidian"
Issues = "https://github.com/lojeunhou/zotero-notes-to-obsidian/issues"

[project.scripts]
zotero-notes-to-obsidian = "zotero_notes_to_obsidian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
